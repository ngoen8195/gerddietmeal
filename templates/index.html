<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERD Diet Meal Planner</title>
    <meta name="description"
        content="Sophisticated meal planning for acid reflux management. Plan GERD-safe meals weekly.">
    <link rel="icon" type="image/x-icon" href="/resources/icons/gerddietmeal.ico">
    <link rel="stylesheet" href="/static/css/design-tokens.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <img src="/resources/icons/gerddietmeal_noname.png" alt="GERD Diet Meal Planner Logo">
                &nbsp;<span class="logo-bold">gerd</span><span class="logo-light">dietmeal</span>
            </div>
            <nav class="tab-nav" role="tablist">
                <button class="tab-btn active" data-tab="home" role="tab" aria-selected="true">Home</button>
                <button class="tab-btn" data-tab="food-library" role="tab">Food Library</button>
                <button class="tab-btn" data-tab="meal-library" role="tab">Meal Library</button>
                <button class="tab-btn" data-tab="favorites" role="tab">Favorite Meals</button>
            </nav>
        </header>

        <main>
            <!-- ═══ HOME TAB ═══ -->
            <section id="tab-home" class="tab-content active" role="tabpanel">
                <div class="planner-header">
                    <div class="week-navigation">
                        <button class="btn-icon" id="btn-prev-week" title="Previous Week">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m15 18-6-6 6-6" />
                            </svg>
                        </button>
                        <div class="week-dropdown-wrapper">
                            <select id="week-dropdown" class="week-dropdown"></select>
                        </div>
                        <button class="btn-icon" id="btn-next-week" title="Next Week">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m9 18 6-6-6-6" />
                            </svg>
                        </button>
                    </div>
                    <button class="btn btn-primary" id="btn-generate-plan">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-plus">
                            <path d="M5 12h14" />
                            <path d="M12 5v14" />
                        </svg>
                        Generate Meal Plan
                    </button>
                </div>
                <div id="week-grid" class="week-grid">
                    <div class="empty-state" style="grid-column:1/-1">
                        <h3>No Meal Plan Yet</h3>
                        <p>Click <strong>Meal Plan</strong> to generate a GERD-safe weekly plan.</p>
                    </div>
                </div>
            </section>

            <!-- ═══ FOOD LIBRARY TAB ═══ -->
            <section id="tab-food-library" class="tab-content" role="tabpanel">
                <div class="food-grid-header">
                    <h2>Food Library</h2>
                    <div class="food-filters">
                        <div class="search-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.3-4.3" />
                            </svg>
                            <input type="text" id="food-search" class="input-shadcn" placeholder="Search foods...">
                        </div>
                        <select id="food-category-filter" class="select-shadcn">
                            <option value="">All Categories</option>
                        </select>
                        <select id="food-reflux-filter" class="select-shadcn">
                            <option value="">All Status</option>
                            <option value="ok">✅ Safe</option>
                            <option value="avoid">🚫 Avoid</option>
                            <option value="remedy">💊 Remedy</option>
                        </select>
                        <button class="btn btn-primary" id="btn-add-food"><span>+</span> Add Food</button>
                    </div>
                </div>
                <div id="food-grid" class="food-grid"></div>
            </section>

            <!-- ═══ MEAL LIBRARY TAB ═══ -->
            <section id="tab-meal-library" class="tab-content" role="tabpanel">
                <div class="meal-lib-header">
                    <h2>Meal Library</h2>
                    <div class="meal-lib-search">
                        <div class="search-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.3-4.3" />
                            </svg>
                            <input type="text" id="meal-search" class="input-shadcn"
                                placeholder="Search by name or ingredient...">
                        </div>
                        <button class="btn btn-secondary" id="btn-search-meals">Search</button>
                        <button class="btn btn-primary" id="btn-add-meal"><span>+</span> Add Meal</button>
                        <button class="btn btn-secondary" id="btn-scrape-meals"><span>⬇</span> Scrape</button>
                    </div>
                </div>
                <div id="meal-lib-grid" class="meal-lib-grid"></div>
            </section>

            <!-- ═══ FAVORITES TAB ═══ -->
            <section id="tab-favorites" class="tab-content" role="tabpanel">
                <h2 style="margin-bottom:20px">Favorite Meals</h2>
                <div id="fav-grid" class="fav-grid"></div>
            </section>
        </main>
    </div>
    <div id="notification-container" class="notification-container"></div>

    <!-- ═══ MEAL TOOLTIP (hover bubble) ═══ -->
    <div id="meal-tooltip" class="meal-tooltip">
        <img id="tooltip-img" src="" alt="">
        <div class="meal-tooltip-body">
            <h4 id="tooltip-name"></h4>
            <p id="tooltip-details"></p>
        </div>
    </div>

    <!-- ═══ MODAL: Add/Edit/View Meal ═══ -->
    <div id="meal-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="meal-modal-title">Add Meal</h3>
                <button class="modal-close" id="meal-modal-close">✕</button>
            </div>
            <div class="modal-body">
                <img id="meal-modal-img" class="modal-img-preview" src="/resources/default_meal_image.png" alt="Meal">
                <div class="form-group">
                    <label for="meal-form-image">Image URL</label>
                    <input type="text" id="meal-form-image" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="meal-form-link">Link to Original Recipe</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="meal-form-link" placeholder="https://..." style="flex: 1;">
                        <button class="btn-icon" id="btn-open-source" title="Open Original Recipe"
                            style="display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M21 9L21 3M21 3H15M21 3L13 11M10 5H7.8C6.11984 5 5.27976 5 4.63803 5.32698C4.07354 5.6146 3.6146 6.07354 3.32698 6.63803C3 7.27976 3 8.11984 3 9.8V16.2C3 17.8802 3 18.7202 3.32698 19.362C3.6146 19.9265 4.07354 20.3854 4.63803 20.673C5.27976 21 6.11984 21 7.8 21H14.2C15.8802 21 16.7202 21 17.362 20.673C17.9265 20.3854 18.3854 19.9265 18.673 19.362C19 18.7202 19 17.8802 19 16.2V14" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="meal-form-name">Meal Name</label>
                    <input type="text" id="meal-form-name" placeholder="e.g. Grilled Chicken with Rice">
                </div>
                <div class="form-group">
                    <label for="meal-form-desc">Description</label>
                    <textarea id="meal-form-desc" placeholder="Describe this meal..."></textarea>
                </div>
                <div class="form-group">
                    <label>Ingredients</label>
                    <div class="ingredient-header"
                        style="display: flex; gap: 12px; margin-bottom: 8px; padding-right: 40px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted);">
                        <div style="flex: 2;">Name</div>
                        <div style="width: 60px;">Qty</div>
                        <div style="width: 80px;">Unit</div>
                        <div style="flex: 1;">Comment</div>
                    </div>
                    <div id="meal-form-ingredients" class="ingredient-list"></div>
                    <button class="btn btn-secondary" id="btn-add-ingredient" style="margin-top:8px">+ Add
                        Ingredient</button>
                </div>
                <div class="form-group">
                    <label for="meal-form-time">Cook Time (hours)</label>
                    <input type="number" id="meal-form-time" step="0.25" min="0" placeholder="1.5">
                </div>
                <div class="form-group">
                    <label for="meal-form-calories">Calories (kcal) <span id="meal-form-calories-incomplete"
                            class="calorie-tag" style="display:none; margin-left: 5px;"></span></label>
                    <input type="number" id="meal-form-calories" min="0" placeholder="350">
                </div>
            </div>
            <div class="modal-footer" id="meal-modal-footer">
                <button class="btn btn-secondary" id="meal-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="meal-modal-save">Save</button>
            </div>
        </div>
    </div>

    <!-- ═══ MODAL: Add/Edit Food ═══ -->
    <div id="food-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="food-modal-title">Add Food</h3>
                <button class="modal-close" id="food-modal-close">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="food-form-name">Food Name</label>
                    <input type="text" id="food-form-name" placeholder="e.g. Spinach">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <div class="combobox-wrapper" id="food-category-combobox">
                        <div class="combobox-trigger" id="combobox-trigger">
                            <span id="combobox-value">Select category...</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="combobox-chevron">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </div>
                        <div class="combobox-content" id="combobox-content">
                            <div class="command-input-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="command-search-icon">
                                    <circle cx="11" cy="11" r="8" />
                                    <path d="m21 21-4.3-4.3" />
                                </svg>
                                <input type="text" id="combobox-search" placeholder="Search category...">
                            </div>
                            <div class="command-list" id="combobox-list">
                                <!-- Categories populated via JS -->
                            </div>
                            <div class="command-empty" id="combobox-empty" style="display:none">
                                <button class="command-add-btn" id="btn-add-new-category">
                                    <span>+</span> Add "<span id="new-category-name"></span>"
                                </button>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="food-form-category">
                </div>
                <div class="form-group">
                    <label for="food-form-reflux">Status</label>
                    <select id="food-form-reflux" class="select-shadcn">
                        <option value="ok">✅ Safe</option>
                        <option value="avoid">🚫 Avoid</option>
                        <option value="remedy">💊 Remedy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="food-form-meal-type">Meal Type</label>
                    <select id="food-form-meal-type" class="select-shadcn">
                        <option value="breakfast">🍳 Breakfast</option>
                        <option value="lunch/dinner">🍲 Lunch/Dinner</option>
                        <option value="both">🍱 Both</option>
                        <option value="none">✖ None</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="food-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="food-modal-save">Save</button>
            </div>
        </div>
    </div>

    <!-- ═══ MODAL: Scrape Progress ═══ -->
    <div id="scrape-progress-modal" class="modal-overlay">
        <div class="modal modal-glass">
            <div class="modal-header">
                <h3>Scraping Recipes</h3>
            </div>
            <div class="modal-body" style="text-align:center; padding: 40px 20px;">
                <div id="scrape-status-msg" style="margin-bottom:20px; font-weight:500; color: var(--text-muted);">
                    Initializing...</div>
                <div class="progress-container"
                    style="background: rgba(255,255,255,0.05); border-radius: 10px; height: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);">
                    <div id="scrape-progress-bar"
                        style="width: 0%; height: 100%; background: var(--gradient-primary); transition: width 0.4s ease; box-shadow: 0 0 15px var(--primary-light);">
                    </div>
                </div>
                <button class="btn btn-secondary" id="btn-terminate-scrape"
                    style="background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: rgba(231, 76, 60, 0.2);">Terminate
                    Process</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js" type="module"></script>
</body>

</html>
